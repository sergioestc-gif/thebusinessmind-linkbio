<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  :root {
    --bg: #0a0a14;
    --bg2: #15152a;
    --gold: #f0c040;
    --text: #f5f0e6;
    --muted: #8a8a9a;
    --card: #14141f;
    --card-border: #26263a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-inline: 20px;
    padding-block: 48px;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--gold), #c99a1f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 10px 30px rgba(240, 192, 64, 0.2);
  }

  .identity {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .identity h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.3px;
  }

  .identity p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .link-card:hover {
    border-color: var(--gold);
    transform: translateY(-1px);
  }

  .link-card .icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: rgba(240, 192, 64, 0.12);
  }

  .link-card .meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .link-card .meta .label {
    color: var(--text);
  }

  .link-card .meta .sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-card.primary {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(240, 192, 64, 0.14), rgba(240, 192, 64, 0.04));
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .footer {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  @media (prefers-color-scheme: light) {
    body { background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 60%); }
  }
</style>

<div class="page">

    </a>

    <a class="link-card" href="https://youtube.com/@TheBusinessMind-l9h" target="_blank" rel="noopener">
      <div class="icon">▶️</div>

      </div>
    </a>

    <a class="link-card" href="https://facebook.com/profile.php?id=1270347839504511" target="_blank" rel="noopener">

    <a class="link-card" href="https://instagram.com/menteestoica.es" target="_blank" rel="noopener">

    </a>
  </div>

  <div class="footer">THE BUSINESS MIND</div>
</div>
